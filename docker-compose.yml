  redis:
    image: redis:8-alpine
    container_name: hobby-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./config.yml:/app/config.yml
    depends_on:
      - redis

volumes:
#   postgres_data:
  redis-data: